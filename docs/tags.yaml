  # NEW (Claude) --------------------------------------------------------
  # The 5 and 6 bands were nearly empty, and the design doc names "giant" as
  # its own 6-point example.
  # The biggest body bonus in the game, and the priciest tag, which until now
  # bought no carry at all (docs/systemdocs/CARRY.md §1).
  giant:
    catalog: all
    name: Giant
    category: general
    group: general-traits
    description: "You are a behemoth among humanity and struggle to fit into confined spaces. However, you could easily crush anyone. {carry:giant}"
    pointCost: 14
    visible: true
    purchasable: true
    purchasableAfterStart: false
    carryBonus: 0.75
    # Giant, Strong and Pack Mule are one fiction — a big body that hauls —
    # so they never stack. Authored here and on Strong; db:sync-tags mirrors
    # the edges (TAGS.md §2).
    conflictsWith: [strong, pack-mule]

  # +0.5 on both carry caps, i.e. ×1.5 on its own; adds with Cart
  # (docs/systemdocs/CARRY.md).
  # Priced at 4 by Bascinet's call — between the 2 and 5 bands, deliberately
  # (TAGS.md §4a). {carry:pack-mule} renders the exact bonus from the live
  # config, so the number never drifts from what the caps actually are.
  pack-mule:
    catalog: all
    name: Pack Mule
    category: general
    group: general-traits
    description: "Broad back, strong legs, and no shame about what you'll haul. {carry:pack-mule}"
    pointCost: 4
    visible: true
    purchasable: true
    purchasableAfterStart: true
    carryBonus: 0.5

  # The mirror of Pack Mule above, and priced as its mirror: -4 for -0.5.
  pack-mouse:
    catalog: all
    name: Pack Mouse
    category: general
    group: general-traits
    description: "You carry less than the average person. {carry:pack-mouse}"
    pointCost: -4
    visible: true
    purchasable: true
    purchasableAfterStart: false
    carryBonus: -0.5
    # Same fiction as Giant's comment above, from the other end: a scrawny
    # under-carrier can't also be the big body that hauls.
    conflictsWith: [pack-mule, strong, giant]

  old:
    catalog: all
    name: Old
    category: general
    group: general-traits
    description: "Elderly. You're slower and fight slightly worse."
    pointCost: -5
    carryBonus: -0.05
    visible: true
    purchasable: true
    purchasableAfterStart: false

  # Costed at -1 rather than the scale's -2 (docs/systemdocs/TAGS.md §4a): it
  # is nearly all flavour, and it is the gate on the Leper's Hood, which is a
  # 0-point item. At -2 the pair would have PAID a player to take a free hood.
  #
  # conflictsWith runs BOTH ways on purpose. Against Pretty and Beautiful it is
  # the same edge Ugly and Disfigured already carry — you cannot be covered in
  # sores and divine. Against Ugly and Disfigured it is about points: all three
  # are the one fiction, "your face is hard to look at", and without the edge a
  # build could bank -4 of the -12 drawback budget for it three times over.
  leper:
    catalog: all
    name: Leper
    category: general
    group: general-traits
    description: "Covered in sores."
    pointCost: -1
    conflictsWith: [pretty, beautiful, ugly, disfigured]
