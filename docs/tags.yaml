  # Meals. Cooked as a Routine Move, not bought: purchasable false keeps them
  # out of both point-buy menus, while craftable true is what lets
  # addTagRequestImpl accept a player cooking one. The per-Move batch caps
  # (4 Fine, 3 Lavish) are a GM adjudication reference, like every other
  # requirement block — see docs/documents.yaml's Meals & Kitchens document.
  # Cut off a person with the Butcher button (docs/systemdocs/CORPSES.md).
  # Consumed exactly as a Fine Meal is — it feeds you and it settles the turn's
  # hunger — which is the whole joke: it is, mechanically, dinner.
  #
  # NOT sellable, and that is a balance decision rather than squeamishness.
  # Butchering is free (no ⬢, no Move) and every single death mints a corpse,
  # so a priced Human Flesh would be a code-enforced ⬢ faucet hanging off a
  # free action. `tradeable: true` still lets players sell it to each other for
  # whatever they can get, which is the right market for it anyway.
  #
  # visible: false — this one is on Bascinet's instruction, and it is also
  # right by the catalog rule: a wrapped parcel of meat is not something a
  # stranger looking you over can identify.
  human-flesh:
    catalog: gm
    name: Human Flesh
    category: items
    group: items-food
    description: "Meat, cut from a person. It keeps you alive, but at what cost?"
    pointCost: 0
    tradeable: true
    weight: 5
    stackable: true
    visible: false
    purchasable: false
    purchasableAfterStart: false
    consumable: true
    consumesInto:
      - ate-meal
    sellable: false

  # --- Remains -----------------------------------------------------------
  # What the Mutilate button takes off a bound person or a corpse, one piece
  # at a time (docs/systemdocs/TORTURE.md §6). Shaped exactly like Human
  # Flesh above and unpriced for the same reason: mutilating is free and every
  # death mints a body, so a part the Depot bought would be a code-enforced ⬢
  # faucet hanging off a free action. They stay `tradeable`, so players can
  # still sell them to each other for whatever they can get.
  #
  # The Merchant's station DOES buy them now, which is the ⬢ faucet the note
  # above worried about — deliberately, and priced so that butchering a body
  # comes to roughly ONE good day's labour rather than three. Mutilate is a
  # free action and every death mints a body, so the arithmetic that matters is
  # the whole ladder at once: db/lib/mutilate.js takes nine pieces off one
  # subject (two eyes, two hands, two feet, tongue, stomach, heart), which at
  # these numbers is 49 ⬢ against 30-42 ⬢ for a specialised labour day. At the
  # first pass it was 94 ⬢ and this comment claimed otherwise.
  #
  # The eye and the heart are dearer than the rest because the rites eat those
  # two (db/lib/rites.js).
  #
  # `keepSlug` on the eye: it is called an Eyeball on the sheet now, and the
  # Rite of Judgement's ingredient list names the slug `eye`.

  eye:
