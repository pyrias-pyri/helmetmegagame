  # one. `escalatesInto` is what makes the second drink matter: consuming
  # something that grants a rung you already hold clears that rung and gives
  # you the one above instead. So tipsy -> wasted -> unconscious, and the only
  # way down is to stop.
  #
  # None of the Fighting penalties below is enforced in code — no line in the
  # repo reads `tipsy`. They are numbers a GM weighs while adjudicating a
  # fight, which is how the original Tipsy has always worked.
  tipsy:
