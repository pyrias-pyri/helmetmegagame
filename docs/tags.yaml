    name: Festering
    category: health
    group: health-infection
    description: "The flesh around the wound goes soft and gives off an odor. Amputation still would work."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1
    expiresInto: [feverish, necrosis]
    removesInto: [recovering]
    healable: true
    requirement:
