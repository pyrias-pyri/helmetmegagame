  # THE SIX COURTIER SEALS are the one place a tag is both bought and made, and
  # TAGS.md §4's "nothing is both" invariant is knowingly bent here. A courtier
  # buys their own mark at creation; a Forger (Brigands only, general-brigand)
  # FORGES somebody else's at 1 turn and 2 ⬢. That is the whole feature — the
  # point cost is the honest route and the recipe is the dishonest one, and
  # they are meant to reach the same object. It is not an Add Tag loophole:
  # §3b removed the menu's buy route, so `craftable` here only ever costs
  # resources and a turn.
